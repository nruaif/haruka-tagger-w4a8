name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: haruka-w4a8-windows-x86_64.zip
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: haruka-w4a8-linux-x86_64.tar.gz
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: haruka-w4a8-macos-aarch64.tar.gz
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: haruka-w4a8-macos-x86_64.tar.gz
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI/Vulkan build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI & GUI (release)
        run: cargo build --release --bins --target ${{ matrix.target }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/haruka-w4a8.exe dist/
          Copy-Item target/${{ matrix.target }}/release/haruka-w4a8-gui.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/haruka-w4a8 dist/
          cp target/${{ matrix.target }}/release/haruka-w4a8-gui dist/
          cp README.md dist/
          tar -czvf ${{ matrix.archive }} -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
