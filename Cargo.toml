[package]
name = "haruka-w4a8"
version = "0.1.0"
edition = "2021"
description = "Fast W4A8 AWQ-QAT Haruka-Tagger inference in Rust using wgpu and multi-threaded CPU fallback"
license = "Apache-2.0"

[lib]
name = "haruka_w4a8"
path = "src/lib.rs"

[[bin]]
name = "haruka-w4a8"
path = "src/main.rs"

[[bin]]
name = "haruka-w4a8-gui"
path = "src/gui.rs"

[dependencies]
anyhow = "1.0"
arrow-array = { version = "54", default-features = false }
arrow-schema = { version = "54", default-features = false }
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
flate2 = "1.0"
half = { version = "2.4", features = ["bytemuck"] }
image = "0.25"
memmap2 = "0.9"
parquet = { version = "54", default-features = false, features = ["arrow"] }
pollster = "0.4"
rayon = "1.10"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
safetensors = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
wgpu = "24.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
